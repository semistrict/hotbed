syntax = "proto3";

// hotbed's API, spoken by the CLI, the cockpit, the controller and the
// workers. Times are unix milliseconds; sizes are bytes.
package hotbed.v1;

option go_package = "github.com/semistrict/hotbed/internal/gen/hotbed/v1;hotbedv1";

// The controller: membership, reports, repos and the cockpit's view.
service ClusterService {
  // Join admits the calling tailnet node as a worker.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Report is how workers before the event stream accounted for
  // themselves: their whole state, which the controller took as the node's
  // view. The controller still takes it until every worker pushes events.
  rpc Report(ReportRequest) returns (ReportResponse);
  // PushEvents delivers a worker's events, in order, from after what the
  // controller has applied; or a checkpoint of its state when the
  // controller cannot continue from what it has.
  rpc PushEvents(PushEventsRequest) returns (PushEventsResponse);
  // Heartbeat is a worker's live usage, lossy: the latest wins. It keeps
  // the node online, and its reply is what the worker should host.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  // GetBuild is the build the controller runs, for a platform: what a node
  // or client on it installs to run the controller's build.
  rpc GetBuild(GetBuildRequest) returns (Build);
  // UpgradeController checks CI for a newer build immediately, installs it
  // over the controller, and restarts the controller as it.
  rpc UpgradeController(UpgradeControllerRequest) returns (UpgradeControllerResponse);
  rpc ListRepos(ListReposRequest) returns (ListReposResponse);
  rpc PutRepo(PutRepoRequest) returns (Repo);
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  // RebuildRepo has every worker build the repo's next base from nothing.
  // Bases are otherwise built incrementally: each generation forks the one
  // before, pulls, and freshens.
  rpc RebuildRepo(RebuildRepoRequest) returns (Repo);
  // PutStep adds a setup step to a repo, or replaces the one of that name.
  // The next workspace of the repo gets a base that has run it.
  rpc PutStep(PutStepRequest) returns (Repo);
  rpc DeleteStep(DeleteStepRequest) returns (Repo);
  // ListSteps is a repo's steps and, for each, whether each node's newest
  // base has run it.
  rpc ListSteps(ListStepsRequest) returns (ListStepsResponse);
  // AddProject creates a project, or adds repos to the one of that name. A
  // repo another project holds is refused unless shared: sessions starting
  // in its checkouts would then have to name their project.
  rpc AddProject(AddProjectRequest) returns (Project);
  // RemoveProjectRepos takes repos out of a project.
  rpc RemoveProjectRepos(RemoveProjectReposRequest) returns (Project);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  // GetProject is a project with every change made to it.
  rpc GetProject(GetProjectRequest) returns (Project);
  // GetSnapshot is everything the cockpit shows.
  rpc GetSnapshot(GetSnapshotRequest) returns (Snapshot);
}

// An agent's sessions, on the controller. A session holds workspaces, of
// any repos on any nodes, and an agent waits on everything that happens to
// the commands it runs in them.
service SessionService {
  // StartSession starts a session in a project: the one named, or else the
  // one project that holds the caller's checkout's repo. A repo no project
  // holds is a project of its own, made for it.
  rpc StartSession(StartSessionRequest) returns (Session);
  // GetSession returns a session (live or ended) with its workspaces and
  // commands, without resetting its idle timer.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // ListSessions lists a project's sessions, or every project's: those
  // live, and with ended, those that ended in the last day too; the most
  // recently active first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // EndSession stops the session's commands and releases its workspaces.
  // A session nothing touches for an hour ends the same way; WatchSession
  // keeps it alive.
  rpc EndSession(EndSessionRequest) returns (Session);
  // WatchSession streams what happens to the session's commands after a
  // cursor: first how it stands, then each new batch of events as it
  // happens. It ends when the session does, or after at most two minutes, so
  // an agent that wants the session kept has to keep watching it.
  rpc WatchSession(WatchSessionRequest) returns (stream WatchSessionResponse);
}

// Workspaces and the commands in them. Workers serve it to clients, which
// call the worker that holds a workspace (Workspace.node_addr) directly. The
// controller serves it too: it creates workspaces, lists them and their
// commands from its view of each worker, and forwards the other calls, for
// older clients and the cockpit.
service WorkspaceService {
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace);
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  // WatchWorkspace streams the workspace as it is, then again each time it
  // changes (such as from preparing to ready), until it is released or the
  // caller stops listening.
  rpc WatchWorkspace(WatchWorkspaceRequest) returns (stream Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ReleaseWorkspace(ReleaseWorkspaceRequest) returns (ReleaseWorkspaceResponse);
  // Sync checks out an agent's worktree in a workspace. The first message
  // names the snapshot; the rest carry a git bundle of it.
  rpc Sync(stream SyncRequest) returns (SyncResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc GetFile(GetFileRequest) returns (FileContent);
  rpc RunCommand(RunCommandRequest) returns (Command);
  rpc GetCommand(GetCommandRequest) returns (Command);
  rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
  rpc StopCommand(StopCommandRequest) returns (Command);
  // FollowLog streams a command's output from an offset; with follow, until
  // the command ends. An attached command stops when no one follows it.
  rpc FollowLog(FollowLogRequest) returns (stream LogChunk);
  rpc GetLogLines(GetLogLinesRequest) returns (CommandLog);
}

// ErrorInfo rides on every error as a detail: a code programs act on, what
// to do about it, and whether the same call can succeed later.
message ErrorInfo {
  string code = 1;
  string suggestion = 2;
  bool retryable = 3;
}

// ---- nodes -------------------------------------------------------------

message Resources {
  string arch = 1;
  int32 cpus = 2;
  int64 memory_bytes = 3;
  int64 swap_bytes = 4;
  string kernel = 5;
  // What the machine is, as a person would say it: "MacBook Pro (14-inch, M3 Pro, Nov 2023)".
  string machine = 6;
  // The CPUs a measurement has to itself (a cpulist, 4-7,12-15); empty on a
  // node that takes no measurements.
  string bench_cpus = 7;
  // The hotbed build it runs: "build 42 (0123456789ab)", or "dev (...)".
  string version = 8;
}

message NodeUsage {
  // Share of CPU time busy across all CPUs, 0..1.
  double cpu_busy = 1;
  int64 memory_used_bytes = 2;
  int64 swap_used_bytes = 3;
  // PSI "some" avg10, percent of time at least one task stalled.
  double cpu_pressure = 4;
  double memory_pressure = 5;
}

// A node's filesystem, by what the blocks belong to.
message DiskUsage {
  int64 bases_bytes = 1;
  int64 forks_exclusive_bytes = 2;
  int64 other_bytes = 3;
  int64 free_bytes = 4;
}

// A worker. Its identity (id, hostname, login) comes from the tailnet.
message Node {
  string id = 1;
  string hostname = 2;
  string login = 3;
  int64 joined_at = 4;
  optional int64 last_seen = 5;
  bool online = 6;
  Resources resources = 7;
  NodeUsage usage = 8;
  int64 disk_bytes = 9;
  DiskUsage disk = 10;
  // What admitted commands are guaranteed: the sum of their memory.low.
  int64 reserved_memory_bytes = 11;
  string storage = 12;
  // Its page in the cockpit. The CLI fills it from the controller it
  // calls (cmd/hotbed/cockpit.go); the API leaves it empty.
  string cockpit_url = 13;
}

message JoinRequest {}

message JoinResponse {
  string cluster_id = 1;
  Node node = 2;
}

message ListNodesRequest {}

message ListNodesResponse {
  string cluster_id = 1;
  repeated Node nodes = 2;
  // The hotbed build the controller runs, which every node follows.
  string controller_version = 3;
}

// A build of hotbed the controller keeps for one platform, which nodes
// install over themselves.
message Build {
  int64 number = 1;
  // Its binary's sha256, hex.
  string sha256 = 2;
  // Where the controller serves its binary: /builds/N/hotbed-OS-ARCH.
  string path = 3;
}

message GetBuildRequest {
  string os = 1;
  string arch = 2;
}

message UpgradeControllerRequest {}

message UpgradeControllerResponse {
  // The build the controller runs, or is restarting into.
  int64 build = 1;
  // The build the controller was running before (0 for a dev build).
  int64 from = 2;
  // True when a new build was installed and the controller is restarting.
  bool restarting = 3;
}

// ---- repos and bases --------------------------------------------------

message Repo {
  // Short name, such as ratel; workspaces see the checkout at /work/<id>.
  string id = 1;
  string url = 2;
  // The branch bases follow; empty means the remote's default.
  string branch = 3;
  reserved 4;
  reserved "freshen";
  // Host names of the nodes that keep bases; empty means every worker.
  repeated string hosts = 5;
  int64 created_at = 6;
  // Raised by RebuildRepo: a worker whose newest base has a lower epoch
  // builds the next one from nothing.
  int64 scratch_epoch = 7;
  // What brings a checkout up to date, run in order in each base so that
  // forks start with it: toolchains, dependencies, builds.
  repeated Step steps = 8;
}

// A setup step: an idempotent bash script, run with -eo pipefail in the
// checkout. Like a database migration, a base runs it once and again only
// when its script changes; an every_pull step also runs after every pull.
message Step {
  // Lowercase words joined by dashes, such as playwright-browsers.
  string name = 1;
  string script = 2;
  // Run after every pull too: builds, and installs from a lockfile.
  bool every_pull = 3;
  // The script's sha256, 12 hex digits: a base that ran another hash runs it again.
  string hash = 4;
  int64 updated_at = 5;
  // The machine it was set from.
  string updated_by = 6;
}

// What a base did with one of its repo's steps.
message AppliedStep {
  string name = 1;
  // The script's hash as the base ran it, or inherited it from the base it
  // forked.
  string hash = 2;
  // Ran in this generation, rather than inherited.
  bool ran = 3;
  // False for the step that failed this generation's freshen.
  bool ok = 4;
  // How long it took in the generation that ran it.
  double seconds = 5;
}

message PutStepRequest {
  string repo_id = 1;
  // hash, updated_at and updated_by are the controller's to set.
  Step step = 2;
  // Put the step before this one; empty keeps a replaced step where it is
  // and puts a new one last.
  string before = 3;
}

message DeleteStepRequest {
  string repo_id = 1;
  string name = 2;
}

message ListStepsRequest {
  string repo_id = 1;
}

message ListStepsResponse {
  repeated StepStatus steps = 1;
}

enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  // The node's newest base ran this version of the script.
  STEP_STATE_APPLIED = 1;
  // It has not: the next base there will run it.
  STEP_STATE_PENDING = 2;
  // This version failed in the node's newest freshen.
  STEP_STATE_FAILED = 3;
}

message StepStatus {
  Step step = 1;
  repeated StepOnNode nodes = 2;
}

message StepOnNode {
  string node = 1;
  // The node's newest base of the repo that is not still building.
  string base_id = 2;
  StepState state = 3;
  double seconds = 4;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message PutRepoRequest {
  Repo repo = 1;
}

message DeleteRepoRequest {
  string id = 1;
}

message DeleteRepoResponse {}

message RebuildRepoRequest {
  string id = 1;
}

enum BaseState {
  BASE_STATE_UNSPECIFIED = 0;
  BASE_STATE_BUILDING = 1;
  BASE_STATE_WARM = 2;
  BASE_STATE_STALE = 3;
  BASE_STATE_FAILED = 4;
}

// One generation of a repo's branch, checked out, freshened and snapshotted
// on one node.
message Base {
  // <repo>-g<generation>, unique on its node.
  string id = 1;
  string repo_id = 2;
  string node_id = 3;
  int32 generation = 4;
  string commit = 5;
  string message = 6;
  BaseState state = 7;
  // Share of freshen steps done while building, 0..1.
  double progress = 8;
  optional int64 built_at = 9;
  double build_seconds = 10;
  // The generation started from nothing, so its time is what a fork saves.
  bool cold = 11;
  int64 size_bytes = 12;
  string toolchain = 13;
  repeated string baked = 14;
  // Units (cargo crates) a cold freshen compiled.
  int32 units = 15;
  // The freshen command's ID, for its log.
  string command = 16;
  // The repo's scratch_epoch when this generation was started.
  int64 scratch_epoch = 17;
  // Every step of the repo as this generation left it, in order.
  repeated AppliedStep steps = 18;
  // A fingerprint of the commit and steps it was built for, so a failed
  // freshen is not tried again until one of them changes.
  string recipe = 19;
}

// ---- workspaces ---------------------------------------------------------

enum WorkspaceState {
  WORKSPACE_STATE_UNSPECIFIED = 0;
  WORKSPACE_STATE_ACTIVE = 1;
  WORKSPACE_STATE_IDLE = 2;
  WORKSPACE_STATE_RELEASED = 3;
  // Its base is being brought up to date (pulled and freshened); commands
  // run in it queue until it is ready.
  WORKSPACE_STATE_PREPARING = 4;
  // Its base failed to freshen; reason says why.
  WORKSPACE_STATE_FAILED = 5;
}

// A writable fork of a base that one agent works in.
message Workspace {
  string id = 1;
  string repo_id = 2;
  string base_id = 3;
  string node_id = 4;
  string agent = 5;
  string branch = 6;
  // The commit last synced, or the base's.
  string head = 7;
  string base_commit = 8;
  // The tree last synced, so a sync of the same tree sends nothing.
  string tree = 9;
  int32 files_changed = 10;
  WorkspaceState state = 11;
  int64 created_at = 12;
  int64 fork_millis = 13;
  int64 exclusive_bytes = 14;
  int64 shared_bytes = 15;
  int64 last_active_at = 16;
  // Where commands see the checkout, such as /work/ratel.
  string path = 17;
  string session_id = 18;
  // A local checkout this workspace follows: hotbed run from sync_host syncs
  // sync_dir first. Empty for a remote-only workspace, which agents change
  // only through commands run in it.
  string sync_dir = 19;
  string sync_host = 20;
  // Why it failed, what it waits for while preparing, or, once ready, why
  // its base is not up to date (a step failed in the newer one).
  string reason = 21;
  // Set by the controller: where clients call the workspace's worker
  // (host:port) to sync, run commands and read their output.
  string node_addr = 22;
  // Its page in the cockpit. The CLI fills it from the controller it
  // calls (cmd/hotbed/cockpit.go); the API leaves it empty.
  string cockpit_url = 23;
}

message CreateWorkspaceRequest {
  string repo = 1;
  string agent = 2;
  string branch = 3;
  // Pins the workspace to a node (host name); otherwise the controller picks
  // the one with a warm base and the most free memory.
  string node = 4;
  // Set by the controller when it forwards the call to a worker.
  string id = 5;
  string session_id = 6;
  // A local checkout (on the calling machine) the workspace follows; empty
  // for remote-only.
  string sync_dir = 7;
  // Set by the controller: the calling machine's host name.
  string sync_host = 8;
  // Set by the controller: the repo's configuration, for its freshen.
  Repo repo_config = 9;
}

message GetWorkspaceRequest {
  string id = 1;
}

message WatchWorkspaceRequest {
  string id = 1;
}

message ListWorkspacesRequest {
  // Only this session's workspaces.
  string session_id = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message ReleaseWorkspaceRequest {
  string id = 1;
}

message ReleaseWorkspaceResponse {}

message SyncRequest {
  oneof msg {
    SyncHeader header = 1;
    bytes chunk = 2;
  }
}

message SyncHeader {
  string workspace_id = 1;
  string commit = 2;
  string tree = 3;
}

message SyncResponse {
  string workspace_id = 1;
  string head = 2;
  string tree = 3;
  int32 files_changed = 4;
  // The workspace already had this tree; nothing was sent.
  bool skipped = 5;
  int64 bundle_bytes = 6;
}

message FileEntry {
  string path = 1;
  // file or dir
  string kind = 2;
  int64 size_bytes = 3;
  // Against the workspace's base: added, modified, or empty.
  string change = 4;
}

message ListFilesRequest {
  string workspace_id = 1;
}

message ListFilesResponse {
  repeated FileEntry files = 1;
}

message GetFileRequest {
  string workspace_id = 1;
  string path = 2;
}

message FileContent {
  string path = 1;
  string text = 2;
  // Line numbers (1-based) the workspace changed against its base.
  repeated int32 changed_lines = 3;
}

// ---- commands -----------------------------------------------------------

enum CommandState {
  COMMAND_STATE_UNSPECIFIED = 0;
  COMMAND_STATE_QUEUED = 1;
  COMMAND_STATE_RUNNING = 2;
  // Frozen under memory pressure, its memory in swap, until there is room.
  COMMAND_STATE_PARKED = 3;
  COMMAND_STATE_SUCCEEDED = 4;
  COMMAND_STATE_FAILED = 5;
  COMMAND_STATE_CANCELLED = 6;
}

message CommandLimits {
  // cgroup cpu.weight: the share of contended CPU.
  int32 cpu_weight = 1;
  // cgroup memory.low: guaranteed; admission waits until it fits.
  int64 memory_low_bytes = 2;
  // cgroup memory.high: past it the command is throttled and swapped.
  int64 memory_high_bytes = 3;
}

message Rebuilt {
  int32 units = 1;
  int32 of = 2;
}

message CommandEvent {
  int64 at = 1;
  // queued, admitted, parked, thawed, exited, cancelled
  string what = 2;
  string detail = 3;
}

// A command in a workspace, live or just ended.
message Command {
  string id = 1;
  string workspace_id = 2;
  string node_id = 3;
  // Shell-quoted, for display.
  string argv = 4;
  repeated string args = 5;
  // build, test, check, server, shell, freshen
  string kind = 6;
  CommandState state = 7;
  int64 queued_at = 8;
  optional int64 started_at = 9;
  optional int64 ended_at = 10;
  optional int32 exit_code = 11;
  CommandLimits limits = 12;
  double cpu_cores = 13;
  int64 memory_bytes = 14;
  int64 swap_bytes = 15;
  // Cargo's units compiled; unset for commands that build nothing.
  Rebuilt rebuilt = 16;
  // How long the same command takes from nothing; unset when it builds nothing.
  optional double cold_seconds = 17;
  // Why it waits, sleeps or failed.
  string reason = 18;
  // A dev server's address.
  string url = 19;
  repeated CommandEvent timeline = 20;
  // Stops when no client has followed its output for a while.
  bool attached = 21;
  string session_id = 22;
  // A measurement: it runs alone on the node's measurement CPUs, isolated,
  // never swapped or parked.
  bool bench = 23;
  // Set by the controller: where clients call the command's worker.
  string node_addr = 24;
  // Its page in the cockpit. The CLI fills it from the controller it
  // calls (cmd/hotbed/cockpit.go); the API leaves it empty.
  string cockpit_url = 25;
}

// A command that ended, as history keeps it.
message FinishedCommand {
  string id = 1;
  string repo_id = 2;
  string node_id = 3;
  string workspace_id = 4;
  string agent = 5;
  string argv = 6;
  string kind = 7;
  CommandState state = 8;
  optional int32 exit_code = 9;
  // compile, test, lint, signal, exit; empty when it succeeded.
  string failure = 10;
  int64 ended_at = 11;
  double queued_seconds = 12;
  double seconds = 13;
  optional double cold_seconds = 14;
  optional int32 rebuilt = 15;
  optional int32 of = 16;
  int64 peak_memory_bytes = 17;
  int32 parks = 18;
  string session_id = 19;
  bool bench = 20;
  // Why it failed or was cancelled, as the command's reason says.
  string reason = 21;
  // Its page in the cockpit. The CLI fills it from the controller it
  // calls (cmd/hotbed/cockpit.go); the API leaves it empty.
  string cockpit_url = 22;
}

message RunCommandRequest {
  string workspace_id = 1;
  repeated string args = 2;
  // KEY=VALUE
  repeated string env = 3;
  string kind = 4;
  CommandLimits limits = 5;
  bool attached = 6;
  // The port a dev server listens on, for its URL.
  int32 port = 7;
  // Set by the controller when it forwards the call to a worker; a worker
  // called directly picks one when it is empty.
  string id = 8;
  // Run it as a measurement: alone among measurements on the node, once
  // running work leaves it room, on CPUs no other command uses, isolated
  // for its whole run, never swapped or parked.
  bool bench = 9;
}

message GetCommandRequest {
  string id = 1;
}

message ListCommandsRequest {
  // Only this session's commands.
  string session_id = 1;
}

message ListCommandsResponse {
  repeated Command commands = 1;
}

message StopCommandRequest {
  string id = 1;
}

message FollowLogRequest {
  string id = 1;
  int64 offset = 2;
  bool follow = 3;
}

message LogChunk {
  bytes data = 1;
}

// ---- sessions -------------------------------------------------------------

message Session {
  // adjective-noun, such as brave-otter.
  string id = 1;
  string agent = 2;
  int64 started_at = 3;
  optional int64 ended_at = 4;
  repeated string workspace_ids = 5;
  // The last call that touched the session; an hour after it, the session
  // is abandoned and ends.
  int64 last_active_at = 6;
  // Why it ended: ended by its agent, or abandoned.
  string end_reason = 7;
  // Every workspace it had, released ones too, oldest first.
  repeated SessionWorkspace workspaces = 8;
  // The scheduled command this session is a run of; empty for an agent's.
  string schedule = 9;
  // Its scheduled run is in progress: the idle hour does not apply.
  bool schedule_running = 10;
  // The project it works on.
  string project = 11;
  // Its page in the cockpit. The CLI fills it from the controller it
  // calls (cmd/hotbed/cockpit.go); the API leaves it empty.
  string cockpit_url = 12;
}

message SessionWorkspace {
  string id = 1;
  string repo_id = 2;
  string node_id = 3;
  int64 created_at = 4;
  optional int64 released_at = 5;
  // Its page in the cockpit. The CLI fills it from the controller it
  // calls (cmd/hotbed/cockpit.go); the API leaves it empty.
  string cockpit_url = 6;
}

message StartSessionRequest {
  // The session's name, adjective-noun; it must be free.
  string id = 1;
  string agent = 2;
  // The project it works on; empty for the one that holds remote.
  string project = 3;
  // The canonical remote of the checkout the session starts in
  // (github.com/semistrict/hotbed), to find its project by.
  string remote = 4;
}

message ListSessionsRequest {
  // Empty for every project's.
  string project = 1;
  bool ended = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// ---- projects ---------------------------------------------------------------

// What sessions work on, and what questions are about: one or more repos,
// each named by its canonical git remote (github.com/semistrict/hotbed), as
// a T3 Code project is a folder holding repos. A repo belongs to the project
// of its own name unless a project is made to hold it.
message Project {
  // Lowercase letters, digits and dashes.
  string name = 1;
  // Canonical git remotes, sorted.
  repeated string repos = 2;
  int64 created_at = 3;
  // Set when listed: its sessions that have not ended, its questions
  // waiting for the user, and those waiting for an agent.
  int32 live_sessions = 4;
  int32 open_questions = 5;
  int32 outbox = 6;
  // Its reviews requested or in progress, and those done with findings
  // still open.
  int32 active_reviews = 7;
  int32 reviews_to_decide = 8;
  // Every change to it, oldest first; only from GetProject.
  repeated ProjectChange history = 9;
}

// One change to a project: created, added or removed (a repo).
message ProjectChange {
  int64 seq = 1;
  string what = 2;
  // The repo added or removed, canonical.
  string repo = 3;
  // Who made it: a session, or no session for a person or for the
  // controller itself, which makes a project for a repo no project holds.
  Stamp by = 4;
}

message AddProjectRequest {
  string name = 1;
  // Git remotes in any form (https, ssh, host/path); added to what the
  // project holds.
  repeated string repos = 2;
  // Add a repo another project holds too.
  bool shared = 3;
  // The session making the change, if an agent; empty for a person.
  string session_id = 4;
}

message RemoveProjectReposRequest {
  string name = 1;
  // Git remotes in any form; each must be one the project holds.
  repeated string repos = 2;
  string session_id = 3;
}

message GetProjectRequest {
  string name = 1;
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetSessionRequest {
  string id = 1;
}

message GetSessionResponse {
  Session session = 1;
  // Live workspaces of the session from their nodes' views.
  repeated Workspace workspaces = 2;
  // Live and just-ended commands of the session.
  repeated Command commands = 3;
  // Controller's current time (unix ms).
  int64 now = 4;
  // Idle timeout in seconds before an inactive session is abandoned.
  int64 idle_timeout_seconds = 5;
  // Map of node_id -> hostname for nodes referenced by workspaces/commands.
  map<string, string> node_hosts = 6;
}

message EndSessionRequest {
  string id = 1;
}

message WatchSessionRequest {
  string session_id = 1;
  // Send events after this one (0 for the first).
  int64 after = 2;
  // Stop watching after this long; at most and by default 120.
  int32 timeout_seconds = 3;
}

message WatchSessionResponse {
  repeated SessionEvent events = 1;
  // Pass as after to wait for what comes next.
  int64 cursor = 2;
  // Commands in the session that have not ended.
  int32 live = 3;
  // The session ended (by its agent, or abandoned); no more events will come.
  bool ended = 4;
  string end_reason = 5;
}

// Something that happened to a command in a session.
message SessionEvent {
  // The controller's cursor for the event; workers leave it 0.
  int64 seq = 1;
  int64 at = 2;
  string command_id = 3;
  string argv = 4;
  // admitted, parked, thawed, exited, cancelled; ready and failed for a
  // workspace; answered and dismissed for a question the session asked;
  // reviewed, review failed and responded for a review it requested
  // (command_id empty)
  string what = 5;
  CommandState state = 6;
  optional int32 exit_code = 7;
  string detail = 8;
  string session_id = 9;
  string workspace_id = 10;
  // For answered and dismissed (command_id empty): the session's question
  // that the user answered or dismissed.
  int32 question_id = 11;
  // For reviewed, review failed and responded: the review the session
  // requested that ended, or that someone responded to.
  int32 review_id = 12;
}

message GetLogLinesRequest {
  string id = 1;
  int32 tail = 2;
}

message CommandLog {
  string command_id = 1;
  repeated string lines = 2;
}

// ---- reports ------------------------------------------------------------

message WorkerEvent {
  int64 at = 1;
  // fork, release, admit, finish, fail, park, thaw, base, node
  string kind = 2;
  string text = 3;
  EventRef ref = 4;
}

message EventRef {
  // command, workspace or node
  string type = 1;
  string id = 2;
}

// Finished commands and events carry sequence numbers; a worker sends each
// until the controller acknowledges it, and the controller ignores ones it
// already has.
message SequencedFinished {
  int64 seq = 1;
  FinishedCommand item = 2;
}

message SequencedEvent {
  int64 seq = 1;
  WorkerEvent item = 2;
}

message SequencedSessionEvent {
  int64 seq = 1;
  SessionEvent item = 2;
}

message ReportRequest {
  string cluster_id = 1;
  Resources resources = 2;
  NodeUsage usage = 3;
  int64 disk_bytes = 4;
  DiskUsage disk = 5;
  int64 reserved_memory_bytes = 6;
  // The kernel's OOM kills since boot; hotbed parks instead of killing, so
  // it should not move.
  int64 oom_kills = 7;
  string storage = 8;
  repeated Base bases = 9;
  repeated Workspace workspaces = 10;
  repeated Command commands = 11;
  repeated SequencedFinished finished = 12;
  repeated SequencedEvent events = 13;
  repeated SequencedSessionEvent session_events = 14;
}

message ReportResponse {
  // Every sequence number up to this one is stored.
  int64 ack = 1;
  // The repos this worker keeps bases of.
  repeated Repo repos = 2;
  // Workspaces to release: their sessions ended while the worker was away.
  repeated string release = 3;
}

// ---- the event stream ---------------------------------------------------

// Something that changed in a worker's own state: its bases, workspaces and
// commands. The worker writes each event in the same transaction as the
// change, numbered by a sequence that only grows, and the controller folds
// them, in order, into its view of the node. Each change carries the whole
// entity as it now is, so applying one twice changes nothing.
message Event {
  // The worker's; unique and increasing within its epoch.
  int64 seq = 1;
  int64 at = 2;
  oneof change {
    BaseChange base = 3;
    WorkspaceChange workspace = 4;
    CommandChange command = 5;
  }
  // A line for the cockpit's feed, when the change is worth one.
  WorkerEvent feed = 6;
}

message BaseChange {
  // building, warm, stale, failed, dropped (superseded while building), or
  // collected (the worker deleted it: drop it from the view).
  string what = 1;
  Base base = 2;
  string detail = 3;
}

message WorkspaceChange {
  // created (preparing), ready, rebased (onto an older base: its own failed
  // to freshen), failed, synced, active, idle, released, or forgotten (the
  // worker deleted it, a while after its release).
  string what = 1;
  Workspace workspace = 2;
  string detail = 3;
}

message CommandChange {
  // queued, waiting (the kind of wait changed), admitted, parked, thawed,
  // isolation lost (a measurement's), exited, cancelled, or forgotten
  // (deleted a while after it ended).
  string what = 1;
  Command command = 2;
  string detail = 3;
  // Set when a command (not a freshen) ends: the history entry.
  FinishedCommand finished = 4;
}

// Everything a worker has, as of an event: what the controller starts from
// when it has no view of the node it can continue (a new controller, or a
// worker whose database is new).
message Checkpoint {
  // The last event the state includes; events after it follow.
  int64 seq = 1;
  repeated Base bases = 2;
  repeated Workspace workspaces = 3;
  repeated Command commands = 4;
}

message PushEventsRequest {
  string cluster_id = 1;
  // Names the worker's database. A worker whose database was lost starts
  // a new epoch, and its sequence starts again.
  string epoch = 2;
  // In order, each after the controller's applied; may be empty, to learn
  // where the controller is.
  repeated Event events = 3;
  // When the controller asked for one; events then are those the
  // checkpoint includes that the controller may lack, which it applies
  // first, for what derives from them (history, sessions' timelines).
  Checkpoint checkpoint = 4;
  // The time of the worker's event at the controller's applied: a
  // controller that applied a different event there (the worker's database
  // is an older copy that has written on since) asks for a checkpoint.
  int64 after_at = 5;
}

message PushEventsResponse {
  // The last event of this epoch the controller has applied; the worker
  // sends what follows.
  int64 applied = 1;
  // The controller has no view of this epoch to continue: send a checkpoint.
  bool checkpoint_needed = 2;
}

message CommandUsage {
  string id = 1;
  double cpu_cores = 2;
  int64 memory_bytes = 3;
  int64 swap_bytes = 4;
  // Why a queued command waits, with the numbers as they are now; an event
  // says so only when the kind of wait changes.
  string reason = 5;
}

message BaseUsage {
  string id = 1;
  // Share of freshen steps done while building, 0..1.
  double progress = 2;
  int64 size_bytes = 3;
}

message WorkspaceUsage {
  string id = 1;
  int64 exclusive_bytes = 2;
  int64 shared_bytes = 3;
}

message HeartbeatRequest {
  string cluster_id = 1;
  Resources resources = 2;
  NodeUsage usage = 3;
  int64 disk_bytes = 4;
  DiskUsage disk = 5;
  int64 reserved_memory_bytes = 6;
  int64 oom_kills = 7;
  string storage = 8;
  repeated CommandUsage commands = 9;
  repeated BaseUsage bases = 10;
  repeated WorkspaceUsage workspaces = 11;
  // Sessions whose workspaces or commands clients used on this worker
  // since the last heartbeat, or that a client follows now: calls the
  // controller does not see, which keep a session alive.
  repeated string active_sessions = 12;
}

message HeartbeatResponse {
  // The repos this worker keeps bases of.
  repeated Repo repos = 1;
  // Workspaces to release: their sessions ended.
  repeated string release = 2;
  // The controller's build, for the worker's platform, which the worker
  // installs over itself unless it runs it; unset while the controller runs
  // a build it doesn't keep (a dev build).
  Build build = 3;
}

// ---- the cockpit ----------------------------------------------------------

// A repo as the cockpit describes it, from its newest cold base.
message RepoSummary {
  string id = 1;
  string name = 2;
  // rust, go, typescript
  string language = 3;
  int32 units = 4;
  double cold_build_seconds = 5;
  // Its canonical git remote, which projects hold it by.
  string remote = 6;
}

message ClusterEvent {
  int64 id = 1;
  int64 at = 2;
  string kind = 3;
  string node_id = 4;
  string text = 5;
  EventRef ref = 6;
}

message Totals {
  // Cold time minus actual, over builds that ended in the window.
  double saved_seconds = 1;
  int32 builds = 2;
  int32 forks = 3;
  int64 median_fork_millis = 4;
  int32 oom_kills = 5;
  int32 parks = 6;
}

message Sample {
  int64 t = 1;
  double cpu_busy = 2;
  double memory_used = 3;
  double memory_pressure = 4;
}

message Samples {
  repeated Sample samples = 1;
}

// The cluster's command counts at one sample.
message LoadSample {
  int64 t = 1;
  int32 running = 2;
  int32 queued = 3;
  int32 parked = 4;
}

// One hour of the cluster's history.
message HourBucket {
  int64 hour = 1;
  int32 builds = 2;
  double spent_seconds = 3;
  double saved_seconds = 4;
  int32 forks = 5;
  int32 parks = 6;
  double queue_wait_p95_seconds = 7;
}

message NodeHour {
  int64 hour = 1;
  double cpu_busy = 2;
  double memory_used = 3;
}

message NodeHours {
  repeated NodeHour hours = 1;
}

message GetSnapshotRequest {}

message Snapshot {
  string cluster_id = 1;
  string controller = 2;
  int64 now = 3;
  int32 sample_seconds = 4;
  repeated Node nodes = 5;
  repeated RepoSummary repos = 6;
  repeated Base bases = 7;
  repeated Workspace workspaces = 8;
  repeated Command commands = 9;
  repeated ClusterEvent events = 10;
  Totals totals24h = 11;
  // Live samples per node ID, oldest first.
  map<string, Samples> series = 12;
  repeated LoadSample load = 13;
  // The last 24 hours, oldest first.
  repeated HourBucket hourly = 14;
  map<string, NodeHours> node_hourly = 15;
  repeated FinishedCommand history = 16;
  repeated Session sessions = 17;
  // Every scheduled command, each with its recent runs.
  repeated ScheduledCommand schedules = 18;
  // Questions waiting for the user's answer.
  int32 open_questions = 19;
  // Every project, with what it has going on.
  repeated Project projects = 20;
}

// ---- scheduled commands ---------------------------------------------------

// Scheduled commands: recurring work the controller starts by itself, such
// as a nightly measurement. Each run is a session of its own, with a fresh
// workspace of the repo at its branch's head, in which the command runs
// detached. A run that succeeds ends its session; one that fails leaves it
// for the usual idle hour, so an agent can look inside.
service ScheduleService {
  // PutSchedule adds a scheduled command, or replaces the one of its name.
  rpc PutSchedule(PutScheduleRequest) returns (ScheduledCommand);
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse);
  // GetSchedule is one scheduled command, with more of its runs.
  rpc GetSchedule(GetScheduleRequest) returns (ScheduledCommand);
  // DeleteSchedule removes a scheduled command; a run in progress goes on.
  rpc DeleteSchedule(DeleteScheduleRequest) returns (DeleteScheduleResponse);
  // RunSchedule starts a run now, outside the schedule, unless one is in
  // progress.
  rpc RunSchedule(RunScheduleRequest) returns (ScheduledRun);
  // PauseSchedule stops (or, with paused false, resumes) a schedule's runs.
  rpc PauseSchedule(PauseScheduleRequest) returns (ScheduledCommand);
}

message ScheduledCommand {
  // lowercase words joined by dashes, such as cladefs-nightly.
  string name = 1;
  // Five-field cron, in the controller's time zone unless it starts with
  // CRON_TZ=ZONE, such as "0 2 * * *".
  string cron = 2;
  string repo = 3;
  // Puts every run on this node (host name); otherwise the controller places
  // each like any workspace.
  string node = 4;
  // The command, as hotbed run takes it. Its workspace_id, id, attached and
  // port are the controller's to set.
  RunCommandRequest command = 5;
  bool paused = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  // When the next run is due; unset while paused.
  optional int64 next_at = 9;
  // Its runs, the newest first: a few when listed, more from GetSchedule.
  repeated ScheduledRun runs = 10;
  // The project its runs' sessions work on: the one named when it was
  // added, or else the one that holds its repo.
  string project = 11;
}

enum RunOutcome {
  RUN_OUTCOME_UNSPECIFIED = 0;
  // Its command is queued or running.
  RUN_OUTCOME_RUNNING = 1;
  RUN_OUTCOME_SUCCEEDED = 2;
  // Its command failed, or its workspace did.
  RUN_OUTCOME_FAILED = 3;
  // Its command was stopped, or its session ended under it.
  RUN_OUTCOME_CANCELLED = 4;
  // It could not start: no node to place it on, the repo gone.
  RUN_OUTCOME_NOT_STARTED = 5;
  // Its slot came while the previous run was still in progress.
  RUN_OUTCOME_SKIPPED = 6;
  // Its slot passed while the controller was down.
  RUN_OUTCOME_MISSED = 7;
}

message ScheduledRun {
  int64 id = 1;
  string schedule = 2;
  // The slot it was due at; unset for a run started by hand.
  optional int64 slot_at = 3;
  int64 started_at = 4;
  optional int64 ended_at = 5;
  RunOutcome outcome = 6;
  string session_id = 7;
  string workspace_id = 8;
  string command_id = 9;
  string node_id = 10;
  optional int32 exit_code = 11;
  // Why it failed, was skipped or missed, or did not start.
  string reason = 12;
}

message PutScheduleRequest {
  ScheduledCommand schedule = 1;
}

message ListSchedulesRequest {}

message ListSchedulesResponse {
  repeated ScheduledCommand schedules = 1;
}

message GetScheduleRequest {
  string name = 1;
}

message DeleteScheduleRequest {
  string name = 1;
}

message DeleteScheduleResponse {}

message RunScheduleRequest {
  string name = 1;
}

message PauseScheduleRequest {
  string name = 1;
  bool paused = 2;
}

// ---- questions --------------------------------------------------------------

// Questions agents ask the user: a list for each project, shared by every
// session that works on it, which the
// user answers in the cockpit whenever they like. A question asks what
// AskUserQuestion asks. Answered (or dismissed), it waits in the outbox
// until an agent acknowledges it, and is then handled. Any session may
// delete any question it finds no longer needed. Nothing is ever removed:
// every change is kept, with when it was made and by which session, or by
// the user.
service QuestionService {
  // AddQuestions adds AskUserQuestion's questions to the list, each an
  // entry of its own, at the top of the user's order.
  rpc AddQuestions(AddQuestionsRequest) returns (AddQuestionsResponse);
  // EditQuestion rewrites an open question.
  rpc EditQuestion(EditQuestionRequest) returns (Question);
  // DeleteQuestion takes a question off the list, whoever asked it.
  rpc DeleteQuestion(DeleteQuestionRequest) returns (Question);
  // ListQuestions lists a project's questions, every session's, newest
  // first unless asked for another order.
  rpc ListQuestions(ListQuestionsRequest) returns (ListQuestionsResponse);
  // ListQuestionProjects is every project that has questions, with how
  // many wait on the user and on agents.
  rpc ListQuestionProjects(ListQuestionProjectsRequest) returns (ListQuestionProjectsResponse);
  // GetQuestion is one question with every change made to it.
  rpc GetQuestion(GetQuestionRequest) returns (Question);
  // AnswerQuestion records the user's answer to an open question, which
  // puts it in the outbox.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (Question);
  // DismissQuestion is the user declining to answer an open question; it
  // goes to the outbox too, so its asker learns it will get no answer.
  rpc DismissQuestion(DismissQuestionRequest) returns (Question);
  // MoveQuestion puts an open question elsewhere in the user's order.
  rpc MoveQuestion(MoveQuestionRequest) returns (Question);
  // AckQuestions takes questions out of the outbox: an agent has read
  // their answers. They are handled, all of them or, if one is not in the
  // outbox, none.
  rpc AckQuestions(AckQuestionsRequest) returns (AckQuestionsResponse);
  // WaitQuestions waits, two minutes at most, until one of the named
  // questions is no longer open, or, naming none, until the outbox (a
  // project's, or a session's questions') holds something. It returns those questions, or the outbox, as they are then.
  rpc WaitQuestions(WaitQuestionsRequest) returns (ListQuestionsResponse);
}

// What an agent asks, exactly as AskUserQuestion takes one of its
// questions, so JSON written for that tool is a question here too.
message Prompt {
  // The question, complete and ending in a question mark.
  string question = 1;
  // A short label for it, at most 12 characters: "Auth method".
  string header = 2;
  // Two to four choices.
  repeated PromptOption options = 3;
  // The user may pick several options.
  bool multi_select = 4;
}

message PromptOption {
  // What the user picks, 1-5 words.
  string label = 1;
  // What picking it means.
  string description = 2;
  // Shown beside the option when it is focused: a mockup, code, a diagram.
  string preview = 3;
}

enum QuestionState {
  QUESTION_STATE_UNSPECIFIED = 0;
  // Waiting for the user.
  QUESTION_STATE_OPEN = 1;
  // The user answered it: in the outbox.
  QUESTION_STATE_ANSWERED = 2;
  // The user declined to answer it: in the outbox.
  QUESTION_STATE_DISMISSED = 3;
  // An agent acknowledged its answer or dismissal.
  QUESTION_STATE_HANDLED = 4;
  // A session took it off the list.
  QUESTION_STATE_DELETED = 5;
}

// The user's answer.
message Answer {
  // The labels of the options picked: one at most unless the question is
  // multi_select.
  repeated string picked = 1;
  // What the user wrote instead of picking, or besides: AskUserQuestion's
  // "Other".
  string other = 2;
  // A note on the answer.
  string notes = 3;
}

// Who changed a question, and when: an agent's session, or the user (no
// session), and the machine either called from.
message Stamp {
  int64 at = 1;
  string session = 2;
  string host = 3;
  // Why, when it says: a dismissal's or a deletion's reason.
  string reason = 4;
}

// Where the asking agent was: its checkout, when it was in one, so an answer
// that comes days later can be read in the setting it was asked in.
message AskedFrom {
  // The directory it asked from: its checkout's top, in one.
  string dir = 1;
  // The checkout's origin.
  string remote = 2;
  string branch = 3;
  // The commit checked out.
  string head = 4;
  // How many files differ from it (git status --porcelain), and the first
  // few of those lines.
  int32 dirty_files = 5;
  repeated string dirty = 6;
}

message Question {
  // A number, counting up from 1 in the order questions were asked.
  int32 id = 1;
  Prompt prompt = 2;
  QuestionState state = 3;
  // Its place in the user's order: lower comes first.
  int64 rank = 4;
  // Set once answered; still there once handled.
  Answer answer = 5;
  Stamp asked = 6;
  AskedFrom asked_from = 7;
  // The last edit; unset if it was never edited.
  Stamp edited = 8;
  Stamp answered = 9;
  Stamp dismissed = 10;
  Stamp handled = 11;
  Stamp deleted = 12;
  // Its last change, other than a move in the user's order.
  int64 updated_at = 13;
  // Every change to it, oldest first; only from GetQuestion.
  repeated QuestionChange history = 14;
  // The project it is about: its asking session's.
  string project = 15;
  // The repo of the project it is about, its canonical remote; empty for
  // the project as a whole.
  string repo = 16;
}

// One change to a question, as its history keeps it.
message QuestionChange {
  int64 seq = 1;
  // asked, edited, moved, answered, dismissed, handled, deleted
  string what = 2;
  Stamp by = 3;
  // The question as the change left it, without its history.
  Question question = 4;
}

message AddQuestionsRequest {
  // One to four, as AskUserQuestion takes them.
  repeated Prompt questions = 1;
  // The asking session.
  string session_id = 2;
  AskedFrom asked_from = 3;
  // The repo of the session's project they are about, as a remote in any
  // form; empty for the one asked from (asked_from.remote) when the
  // project holds it, or else the project as a whole.
  string repo = 4;
}

message AddQuestionsResponse {
  repeated Question questions = 1;
}

message EditQuestionRequest {
  int32 id = 1;
  Prompt prompt = 2;
  string session_id = 3;
}

message DeleteQuestionRequest {
  int32 id = 1;
  string session_id = 2;
  string reason = 3;
}

enum QuestionOrder {
  // Newest first.
  QUESTION_ORDER_UNSPECIFIED = 0;
  QUESTION_ORDER_NEWEST = 1;
  QUESTION_ORDER_OLDEST = 2;
  // The most recently changed first.
  QUESTION_ORDER_UPDATED = 3;
  // The user's order.
  QUESTION_ORDER_RANK = 4;
}

message ListQuestionsRequest {
  // Only questions in these states; none means every state but deleted.
  repeated QuestionState states = 1;
  QuestionOrder order = 2;
  // Only the questions this session asked.
  string asked_by = 3;
  // At most this many; 0 for all.
  int32 limit = 4;
  // Only this project's questions; empty for every project's.
  string project = 5;
}

message ListQuestionsResponse {
  repeated Question questions = 1;
  // How many matched, limit aside.
  int32 total = 2;
}

message ListQuestionProjectsRequest {}

message ListQuestionProjectsResponse {
  repeated QuestionProject projects = 1;
}

// A project's questions, counted.
message QuestionProject {
  string name = 1;
  // Waiting for the user.
  int32 open = 2;
  // Answered or dismissed, waiting for an agent.
  int32 outbox = 3;
  // Every question, deleted ones too.
  int32 total = 4;
}

message GetQuestionRequest {
  int32 id = 1;
}

message AnswerQuestionRequest {
  int32 id = 1;
  Answer answer = 2;
  // Set when an agent passes the user's answer on; empty for the user.
  string session_id = 3;
}

message DismissQuestionRequest {
  int32 id = 1;
  string reason = 2;
  string session_id = 3;
}

message MoveQuestionRequest {
  int32 id = 1;
  // Put it just before this open question; 0 puts it last.
  int32 before = 2;
  string session_id = 3;
}

message AckQuestionsRequest {
  repeated int32 ids = 1;
  string session_id = 2;
}

message AckQuestionsResponse {
  repeated Question questions = 1;
}

message WaitQuestionsRequest {
  repeated int32 ids = 1;
  // At most and by default 120.
  int32 timeout_seconds = 2;
  // Naming no questions: the project whose outbox to wait on; empty for
  // every project's.
  string project = 3;
  // Naming no questions: only answers to this session's questions.
  string asked_by = 4;
}

// ---- reviews ----------------------------------------------------------------

// Reviews of an exact version by reviewer agents. A session (the parent)
// requests one; a reviewer session claims it, reports findings and finishes
// it. The parent reads the findings, accepts or dismisses each, and sends
// the user the review's page in the cockpit, where the user responds to
// findings: a quick response, a comment, or both. The parent reads those
// responses. Every change and response is kept, with when and which session
// (or the user) made it.
service ReviewService {
  // RequestReview asks for a review of a version, in the requesting
  // session's project.
  rpc RequestReview(RequestReviewRequest) returns (Review);
  // ListReviews lists a project's reviews, or every project's, newest first,
  // without their findings and events.
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse);
  // GetReview is a review with its findings and every event.
  rpc GetReview(GetReviewRequest) returns (Review);
  // StartReview claims a requested review for the calling session, its
  // reviewer.
  rpc StartReview(StartReviewRequest) returns (Review);
  // AddFindings adds the reviewer's findings, as ReportFindings reports
  // them, with locations besides; it may be called more than once.
  rpc AddFindings(AddFindingsRequest) returns (AddFindingsResponse);
  // FinishReview ends a review: done, with the reviewer's summary, or
  // failed, with why.
  rpc FinishReview(FinishReviewRequest) returns (Review);
  // CancelReview withdraws a review that has not ended.
  rpc CancelReview(CancelReviewRequest) returns (Review);
  // DecideFindings accepts or dismisses findings, or opens them again.
  rpc DecideFindings(DecideFindingsRequest) returns (DecideFindingsResponse);
  // Respond answers a finding, or the review as a whole: a quick response,
  // a comment, or both.
  rpc Respond(RespondRequest) returns (ReviewEvent);
  // ListResponses lists the responses to a review after a cursor.
  rpc ListResponses(ListResponsesRequest) returns (ListResponsesResponse);
  // WaitReview waits, two minutes at most, until a review has ended, or,
  // with responses, until someone other than the caller responds after a
  // cursor. It returns the review as it is then.
  rpc WaitReview(WaitReviewRequest) returns (Review);
}

enum ReviewState {
  REVIEW_STATE_UNSPECIFIED = 0;
  // Waiting for a reviewer.
  REVIEW_STATE_REQUESTED = 1;
  // A reviewer has claimed it and reports findings.
  REVIEW_STATE_IN_PROGRESS = 2;
  // The reviewer finished it.
  REVIEW_STATE_DONE = 3;
  // The reviewer could not finish it.
  REVIEW_STATE_FAILED = 4;
  // Withdrawn before it ended.
  REVIEW_STATE_CANCELLED = 5;
}

// How much a finding matters, as ReportFindings grades it.
enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  // A bug the change adds or makes worse.
  FINDING_SEVERITY_IMPORTANT = 1;
  // A bug that was there before the change.
  FINDING_SEVERITY_PRE_EXISTING = 2;
  // A minor issue.
  FINDING_SEVERITY_NIT = 3;
}

// How sure the reviewer is, as ReportFindings says it.
enum FindingVerdict {
  // Not verified.
  FINDING_VERDICT_UNSPECIFIED = 0;
  FINDING_VERDICT_CONFIRMED = 1;
  FINDING_VERDICT_PLAUSIBLE = 2;
}

// What the parent made of a finding.
enum FindingDecision {
  FINDING_DECISION_UNSPECIFIED = 0;
  // Not decided yet.
  FINDING_DECISION_OPEN = 1;
  // To act on.
  FINDING_DECISION_ACCEPTED = 2;
  // Not to act on.
  FINDING_DECISION_DISMISSED = 3;
}

// A response the user can give a finding with one click.
enum QuickResponse {
  QUICK_RESPONSE_UNSPECIFIED = 0;
  // Check that it is real.
  QUICK_RESPONSE_VERIFY = 1;
  // Check that it is real, and fix it if it is.
  QUICK_RESPONSE_FIX_IF_VERIFIED = 2;
  // Leave it.
  QUICK_RESPONSE_WONT_FIX = 3;
}

// A place in the reviewed version a finding is about.
message Location {
  // Relative to the repo's root.
  string path = 1;
  // 1-based; 0 for the file as a whole.
  int32 start_line = 2;
  // The last line, when it spans several.
  int32 end_line = 3;
  // The lines themselves, as the reviewer saw them, so the cockpit can show
  // them without the code.
  string excerpt = 4;
}

// A finding as a reviewer reports it: ReportFindings' fields, so the JSON
// written for that tool is a finding here, with any number of locations
// besides (file and line, when set, are its first).
message ReportedFinding {
  string file = 1;
  int32 line = 2;
  // The defect.
  string summary = 3;
  // Concrete inputs or state, and the wrong output or crash.
  string failure_scenario = 4;
  // A short kebab-case kind: correctness, efficiency, test-coverage.
  string category = 5;
  // important, pre_existing or nit.
  string severity = 6;
  // The claim alone, at most 60 characters.
  string short_summary = 7;
  // CONFIRMED or PLAUSIBLE; empty when not verified.
  string verdict = 8;
  repeated Location locations = 9;
}

message Finding {
  // Counting up from 1 across every review.
  int32 id = 1;
  int32 review_id = 2;
  string title = 3;
  string summary = 4;
  string failure_scenario = 5;
  string category = 6;
  FindingSeverity severity = 7;
  FindingVerdict verdict = 8;
  repeated Location locations = 9;
  FindingDecision decision = 10;
  // Who decided, when, and why; unset while open.
  Stamp decided = 11;
  Stamp found = 12;
  // The latest quick response to it, if any, which says what the user wants.
  QuickResponse quick = 13;
  // How many responses it has.
  int32 responses = 14;
}

message Review {
  int32 id = 1;
  // The requesting session's.
  string project = 2;
  // The reviewed repo's canonical remote; empty outside one.
  string repo = 3;
  string title = 4;
  // What the reviewer should look at, or for.
  string instructions = 5;
  // The version: changes from base (empty: the whole tree) to head, exact
  // commits. A snapshot of a dirty worktree is a commit too.
  string base = 6;
  string head = 7;
  // The branch head was on, for people.
  string branch = 8;
  // head is a snapshot of uncommitted changes on top of this commit.
  string snapshot_of = 9;
  ReviewState state = 10;
  // The reviewer's summary when done; why it failed or was cancelled.
  string summary = 11;
  Stamp requested = 12;
  // Claimed by its reviewer session.
  Stamp started = 13;
  // Ended: done, failed or cancelled.
  Stamp ended = 14;
  int64 updated_at = 15;
  // From GetReview and WaitReview, oldest first.
  repeated Finding findings = 16;
  repeated ReviewEvent events = 17;
  // Counts, set when listed: findings by severity, still open, and responses.
  int32 important = 18;
  int32 pre_existing = 19;
  int32 nits = 20;
  int32 open = 21;
  int32 responses = 22;
}

// Something that happened to a review: a change, or a response.
message ReviewEvent {
  // The cursor: counting up across every review.
  int64 seq = 1;
  int32 review_id = 2;
  // The finding it is about; 0 for the review as a whole.
  int32 finding_id = 3;
  // requested, started, found, finished, failed, cancelled, accepted,
  // dismissed, reopened, responded
  string what = 4;
  Stamp by = 5;
  // A response's quick response, if it gave one.
  QuickResponse quick = 6;
  // A response's comment, a decision's or an end's reason.
  string text = 7;
}

message RequestReviewRequest {
  string session_id = 1;
  string title = 2;
  string instructions = 3;
  // The repo's remote, in any form; canonical when stored.
  string repo = 4;
  string base = 5;
  string head = 6;
  string branch = 7;
  string snapshot_of = 8;
}

message ListReviewsRequest {
  // Empty for every project's.
  string project = 1;
  // Only reviews in these states; none for all.
  repeated ReviewState states = 2;
  // At most this many, newest first; 0 for all.
  int32 limit = 3;
}

message ListReviewsResponse {
  repeated Review reviews = 1;
}

message GetReviewRequest {
  int32 id = 1;
}

message StartReviewRequest {
  int32 id = 1;
  string session_id = 2;
}

message AddFindingsRequest {
  int32 review_id = 1;
  string session_id = 2;
  repeated ReportedFinding findings = 3;
}

message AddFindingsResponse {
  repeated Finding findings = 1;
}

message FinishReviewRequest {
  int32 id = 1;
  string session_id = 2;
  // The summary when done; why, when failed.
  string summary = 3;
  bool failed = 4;
}

message CancelReviewRequest {
  int32 id = 1;
  string session_id = 2;
  string reason = 3;
}

message DecideFindingsRequest {
  int32 review_id = 1;
  repeated int32 finding_ids = 2;
  FindingDecision decision = 3;
  string reason = 4;
  string session_id = 5;
}

message DecideFindingsResponse {
  repeated Finding findings = 1;
}

message RespondRequest {
  int32 review_id = 1;
  // 0 for the review as a whole.
  int32 finding_id = 2;
  QuickResponse quick = 3;
  string text = 4;
  // Set when an agent responds; empty for the user.
  string session_id = 5;
}

message ListResponsesRequest {
  int32 review_id = 1;
  // Events after this cursor (0 for all).
  int64 after = 2;
}

message ListResponsesResponse {
  repeated ReviewEvent responses = 1;
  // Pass as after for what comes next.
  int64 cursor = 2;
}

message WaitReviewRequest {
  int32 id = 1;
  // Wait for a response after this cursor, from anyone but session_id,
  // rather than for the review to end.
  bool responses = 2;
  int64 after = 3;
  string session_id = 4;
  // At most and by default 120.
  int32 timeout_seconds = 5;
}
