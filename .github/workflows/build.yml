# Every push to main is tested, built for each platform hotbed runs on, and published as the
# release build-N (N the run number, which only grows), and the cf-controller Worker (which
# serves the cockpit UI) is deployed to Cloudflare. The Worker announces the newest release
# and its nodes follow it (internal/update): nothing is deployed by hand.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Tests run concurrently across pushes so Cloudflare Worker/UI deploys are never
# stuck behind an earlier push's 10-minute test-macos run. Only the stateful
# publish/deploy jobs serialize via job-level concurrency groups, each guarded
# against rolling back past a newer live commit or release build number.

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build cf-controller
        run: |
          pnpm -C cf-controller install --frozen-lockfile
          pnpm -C cf-controller run build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -skip '^TestSimulation$' ./...
      - name: Simulation
        run: HOTBED_SIM_STEPS=120 go test -race -count=1 -run '^TestSimulation$' ./cmd/hotbed

  test-linux-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preflight and host setup
        run: |
          set -euo pipefail

          # Fail hard if systemd is not PID 1.
          if [ ! -d /run/systemd/system ] || [ "$(ps -p 1 -o comm=)" != "systemd" ]; then
            echo "systemd is not PID 1 on this runner" >&2
            exit 1
          fi
          systemd_ver=$(systemctl show --property=Version --value)

          # Fail hard if cgroup v2 or required controllers are unavailable.
          if [ ! -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "cgroup v2 unified hierarchy not mounted at /sys/fs/cgroup" >&2
            exit 1
          fi
          controllers=$(cat /sys/fs/cgroup/cgroup.controllers)
          for ctrl in cpu cpuset io memory; do
            case " $controllers " in
              *" $ctrl "*) ;;
              *)
                echo "missing required cgroup v2 controller: $ctrl (have: $controllers)" >&2
                exit 1
                ;;
            esac
          done

          # Ensure VM/FUSE devices exist and match hotbed node policy (kvm/userfaultfd 0660 root:kvm).
          sudo modprobe kvm 2>/dev/null || true
          for dev in /dev/kvm /dev/userfaultfd /dev/fuse; do
            if [ ! -c "$dev" ]; then
              echo "missing required character device: $dev" >&2
              exit 1
            fi
          done
          sudo groupadd -f kvm
          sudo usermod -aG kvm "$USER"
          sudo chgrp kvm /dev/kvm /dev/userfaultfd
          sudo chmod 0660 /dev/kvm /dev/userfaultfd

          # Pick a block-backed mount for HOTBED_TEST_DISK (IOWriteBandwidthMax in unit tests).
          disk=""
          for cand in /mnt /; do
            src=$(findmnt -n -o SOURCE --target "$cand" 2>/dev/null || true)
            src="${src%%\[*}"
            if [ -n "$src" ] && [ -b "$src" ]; then
              disk="$cand"
              break
            fi
          done
          if [ -z "$disk" ]; then
            echo "no block-backed mount found for HOTBED_TEST_DISK" >&2
            exit 1
          fi
          echo "HOTBED_TEST_DISK=$disk" >> "$GITHUB_ENV"

          echo "kernel=$(uname -r) systemd=${systemd_ver} tmpfs=$(stat -f -c %T /tmp) disk=${disk}"
          ls -l /dev/kvm /dev/userfaultfd /dev/fuse
      - name: Build root test binaries
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          for pkg in unit worker; do
            CGO_ENABLED=0 go test -tags systemdtest -c -o "$tmp/hotbed-${pkg}.test" "./internal/${pkg}"
            sudo install -m 0755 "$tmp/hotbed-${pkg}.test" "/usr/local/bin/hotbed-${pkg}.test"
          done
      - name: Test unit (root)
        working-directory: internal/unit
        run: sudo env TMPDIR=/tmp HOTBED_TEST_USER="$USER" HOTBED_TEST_DISK="$HOTBED_TEST_DISK" /usr/local/bin/hotbed-unit.test -test.v -test.count=1
      - name: Test worker (root)
        working-directory: internal/worker
        run: sudo env TMPDIR=/tmp HOTBED_TEST_USER="$USER" /usr/local/bin/hotbed-worker.test -test.v -test.count=1
      - name: Cleanup root test binaries
        if: always()
        run: sudo rm -f /usr/local/bin/hotbed-*.test

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build cf-controller
        run: |
          pnpm -C cf-controller install --frozen-lockfile
          pnpm -C cf-controller run build
      - name: Vet
        run: go vet ./...
      - name: Test
        # cmd/hotbed is ~200 integration tests, each with a controller and
        # workers of its own, run one after another: ~265s under -race on an
        # M-series Mac, past 600s on this runner. Its total, not a hung test,
        # outgrew go test's 10m default; 20m still stops a hang.
        run: go test -race -timeout 20m ./...

  test-cf-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check, test, and build UI assets
        run: |
          pnpm -C ui install --frozen-lockfile
          pnpm -C ui test
          pnpm -C ui typecheck
          pnpm -C ui build
      - name: Check and test cf-controller
        run: |
          pnpm -C cf-controller install --frozen-lockfile
          pnpm -C cf-controller run check
          pnpm -C cf-controller test
          pnpm -C cf-controller run build

  release:
    runs-on: ubuntu-latest
    needs: [test-linux, test-linux-root, test-macos, test-cf-controller]
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - name: Check release monotonicity
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)
          LATEST="${TAG#build-}"
          if [ -n "$LATEST" ] && [ "$LATEST" != "$TAG" ] && [ "$LATEST" -ge "${{ github.run_number }}" ]; then
            echo "Skipping release: newer build-${LATEST} is already published (this run is ${{ github.run_number }})"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.check.outputs.published == 'true'
      - uses: actions/setup-go@v5
        if: steps.check.outputs.published == 'true'
        with:
          go-version-file: go.mod
      - name: Build
        if: steps.check.outputs.published == 'true'
        run: |
          mkdir out
          for p in linux/amd64 linux/arm64 darwin/arm64; do
            CGO_ENABLED=0 GOOS=${p%/*} GOARCH=${p#*/} go build -trimpath \
              -ldflags "-X github.com/semistrict/hotbed/internal/version.build=${{ github.run_number }}" \
              -o "out/hotbed-${p%/*}-${p#*/}" ./cmd/hotbed
          done
          for p in linux/amd64 linux/arm64; do
            # Omit VCS commit metadata so unrelated hotbed commits produce a
            # byte-identical hotbed-guestd and do not invalidate VM base images
            # (which otherwise force cold Debian + project base rebuilds).
            CGO_ENABLED=0 GOOS=${p%/*} GOARCH=${p#*/} go build -trimpath -buildvcs=false \
              -o "out/hotbed-guestd-${p%/*}-${p#*/}" ./cmd/hotbed-guestd
          done
          (cd out && sha256sum hotbed-* > SHA256SUMS)
      - name: Publish
        if: steps.check.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/* --target "${{ github.sha }}" \
            --title "build ${{ github.run_number }}" --notes "${{ github.sha }}" --latest
          # The newest 20 builds are kept.
          gh release list --limit 200 --json tagName --jq '.[20:][].tagName' |
            xargs -r -n1 gh release delete --cleanup-tag --yes
      - name: Upload release checksums
        if: steps.check.outputs.published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-sha256sums
          path: out/SHA256SUMS
          retention-days: 1

  deploy-cf-controller:
    runs-on: ubuntu-latest
    needs: [test-cf-controller]
    concurrency:
      group: deploy-cf-controller
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install cf CLI
        run: npm install -g cf@1.0.0-rc.4
      - name: Guard against rolling back past a newer live deployment (fail-closed)
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIVE_VID=$(cf workers deployments list --worker hotbed-controller | jq -r '.deployments[0].versions[0].version_id')
          test -n "$LIVE_VID" && test "$LIVE_VID" != "null"
          LIVE_MSG=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/hotbed-controller/versions/${LIVE_VID}" \
            | jq -r '.result.annotations["workers/message"] // ""')
          LIVE_SHA=$(printf '%s' "$LIVE_MSG" | grep -oE '[0-9a-f]{40}' | head -n1 || true)
          if [ -z "$LIVE_SHA" ]; then
            echo "Could not determine live commit SHA from active deployment ${LIVE_VID} (message: ${LIVE_MSG}); failing closed" >&2
            exit 1
          fi
          if [ "$LIVE_SHA" != "${{ github.sha }}" ]; then
            git fetch origin main --quiet
            if git merge-base --is-ancestor "${{ github.sha }}" "$LIVE_SHA" 2>/dev/null; then
              echo "Skipping deploy: newer commit ${LIVE_SHA} is already live (this run is ${{ github.sha }})"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Build UI assets
        if: steps.guard.outputs.skip != 'true'
        run: |
          pnpm -C ui install --frozen-lockfile
          pnpm -C ui build
      - name: Install cf-controller dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm -C cf-controller install --frozen-lockfile
      - name: Fetch latest published release metadata
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cf-controller/.release-meta
          TAG=$(gh release view --json tagName --jq '.tagName')
          BUILD_NUM="${TAG#build-}"
          test -n "$BUILD_NUM" && [ "$BUILD_NUM" != "$TAG" ]
          gh release download "$TAG" -p SHA256SUMS -O cf-controller/.release-meta/SHA256SUMS
          echo "HOTBED_BUILD_NUMBER=${BUILD_NUM}" >> "$GITHUB_ENV"
      - name: Deploy Worker
        if: steps.guard.outputs.skip != 'true'
        working-directory: cf-controller
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOTBED_GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          export HOTBED_BUILD_SHA256SUMS="$(cat .release-meta/SHA256SUMS)"
          cf deploy --force --tag "cf-${{ github.run_number }}" --message "cf-${{ github.run_number }} (${{ github.sha }})"
          VID=$(cf workers deployments list --worker hotbed-controller | jq -r '.deployments[0].versions[0].version_id')
          test -n "$VID" && test "$VID" != "null"
          cf workers deployments create \
            --worker hotbed-controller \
            --strategy percentage \
            --versions "[{\"version_id\":\"${VID}\",\"percentage\":100}]" \
            --durable-objects-code-update-mode deferred \
            --durable-objects-code-update-max-delay 30

  deploy-cf-controller-release:
    runs-on: ubuntu-latest
    needs: [deploy-cf-controller, release]
    if: needs.release.outputs.published == 'true'
    concurrency:
      group: deploy-cf-controller
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install cf CLI
        run: npm install -g cf@1.0.0-rc.4
      - name: Guard release build number and preserve newer live Worker code (fail-closed)
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --json tagName --jq '.tagName')
          LATEST_BUILD="${TAG#build-}"
          test -n "$LATEST_BUILD" && [ "$LATEST_BUILD" != "$TAG" ]
          if [ "$LATEST_BUILD" -gt "${{ github.run_number }}" ]; then
            echo "Skipping release announcement: newer build-${LATEST_BUILD} is already published (this run is ${{ github.run_number }})"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LIVE_VID=$(cf workers deployments list --worker hotbed-controller | jq -r '.deployments[0].versions[0].version_id')
          test -n "$LIVE_VID" && test "$LIVE_VID" != "null"
          LIVE_MSG=$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/hotbed-controller/versions/${LIVE_VID}" \
            | jq -r '.result.annotations["workers/message"] // ""')
          LIVE_SHA=$(printf '%s' "$LIVE_MSG" | grep -oE '[0-9a-f]{40}' | head -n1 || true)
          if [ -z "$LIVE_SHA" ]; then
            echo "Could not determine live commit SHA from active deployment ${LIVE_VID} (message: ${LIVE_MSG}); failing closed" >&2
            exit 1
          fi
          DEPLOY_SHA="${{ github.sha }}"
          if [ "$LIVE_SHA" != "${{ github.sha }}" ]; then
            git fetch origin main --quiet
            if git merge-base --is-ancestor "${{ github.sha }}" "$LIVE_SHA" 2>/dev/null; then
              echo "Newer Worker commit ${LIVE_SHA} is already live; checking it out so announcing build-${{ github.run_number }} never rolls back Worker/DB schema"
              git checkout --detach "$LIVE_SHA"
              DEPLOY_SHA="$LIVE_SHA"
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.target.outputs.skip != 'true'
        with:
          name: release-sha256sums
          path: cf-controller/.release-meta
      - name: Build UI assets
        if: steps.target.outputs.skip != 'true'
        run: |
          pnpm -C ui install --frozen-lockfile
          pnpm -C ui build
      - name: Install cf-controller dependencies
        if: steps.target.outputs.skip != 'true'
        run: pnpm -C cf-controller install --frozen-lockfile
      - name: Deploy Worker with new binary release metadata
        if: steps.target.outputs.skip != 'true'
        working-directory: cf-controller
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOTBED_BUILD_NUMBER: ${{ github.run_number }}
          HOTBED_GIT_COMMIT: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          export HOTBED_BUILD_SHA256SUMS="$(cat .release-meta/SHA256SUMS)"
          cf deploy --force --tag "build-${{ github.run_number }}" --message "build-${{ github.run_number }} (${{ steps.target.outputs.sha }})"
          VID=$(cf workers deployments list --worker hotbed-controller | jq -r '.deployments[0].versions[0].version_id')
          test -n "$VID" && test "$VID" != "null"
          cf workers deployments create \
            --worker hotbed-controller \
            --strategy percentage \
            --versions "[{\"version_id\":\"${VID}\",\"percentage\":100}]" \
            --durable-objects-code-update-mode deferred \
            --durable-objects-code-update-max-delay 30
