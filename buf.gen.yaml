version: v2
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "run", "./cmd/protoc-gen-hotbed-hooks"]
    out: internal/gen
    opt: paths=source_relative
  - local: ui/node_modules/.bin/protoc-gen-es
    out: ui/src/gen
    opt: target=ts
clean: true
